## openvibe.locker — reference vhost for ov-vhost-install.
## Locker answers pages and /api/ on 127.0.0.1:5145.
# Log the method and path only. Fragments remain in the browser; query strings are never logged.
log_format locker_noquery '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=locker_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=locker_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.locker www.openvibe.locker;
    access_log /var/log/nginx/openvibe.locker.access.log locker_noquery;
    client_max_body_size 64k;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.locker$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.locker;
    access_log /var/log/nginx/openvibe.locker.access.log locker_noquery;
    client_max_body_size 64k;
    ssl_certificate /etc/letsencrypt/live/openvibe.locker/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.locker/privkey.pem;
    return 301 https://openvibe.locker$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.locker;
    ssl_certificate /etc/letsencrypt/live/openvibe.locker/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.locker/privkey.pem;
    access_log /var/log/nginx/openvibe.locker.access.log locker_noquery;
    error_log /var/log/nginx/openvibe.locker.error.log;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/problem+json text/plain;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = /auth/me { limit_req zone=locker_api burst=30 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:5145; }
    location /auth/ { limit_req zone=locker_auth burst=10 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:5145; }
    location ~ ^/api/v1/uploads/[^/]+/parts/ {
        limit_req zone=locker_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 33m;
        proxy_request_buffering off;
        client_body_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:5145;
    }
    location ~ ^/api/v1/(files|sends)/[^/]+/content$ {
        limit_req zone=locker_api burst=20 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_pass http://127.0.0.1:5145;
    }
    # The application enforces 90 MiB on these legacy single-envelope routes.
    location ~ ^/api/v1/((files|sends)|files/[^/]+(/reseals)?)$ {
        limit_req zone=locker_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 91m;
        proxy_request_buffering off;
        client_body_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 1800s;
        proxy_pass http://127.0.0.1:5145;
    }
    location ~ ^/api/v1/uploads/[^/]+/complete$ {
        limit_req zone=locker_api burst=20 nodelay;
        limit_req_status 429;
        proxy_read_timeout 1800s;
        proxy_pass http://127.0.0.1:5145;
    }
    location /api/ { limit_req zone=locker_api burst=20 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:5145; }
    location ~* ^/(metrics|internal)(/|$) { return 404; }
    location ~ /\.(?!well-known) { deny all; }
    location / { proxy_pass http://127.0.0.1:5145; }
}
